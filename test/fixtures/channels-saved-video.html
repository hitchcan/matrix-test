<!doctype html><meta charset="utf-8"><wujie-app><template shadowrootmode="open"><input type="file" accept="video/mp4,video/*" style="display:none"><div class="post-desc-box"><div contenteditable="" data-placeholder="添加描述" class="input-editor"></div><div class="quick-btns"><div class="finder-tag-wrap btn"><div class="tag-inner">#话题</div></div><div class="finder-tag-wrap btn"><div class="tag-inner">@视频号</div></div></div></div>
<input type="text" placeholder="填写短标题有机会获得更多流量" class="weui-desktop-form__input" />
<div class="form-item cell-center post-with-mark-tag"><div class="label with-tip-label"><span>视频标注</span></div><div class="form-item-body mark-tag-body"><div class="mark-tag-select is-open"><div class="select-display"><span class="select-placeholder">选择视频标注</span></div><span class="select-arrow weui-icon-outlined-arrow"></span><div class="mark-tag-options"><div class="mark-tag-option"><div class="option-main">无需标注</div></div><div class="mark-tag-option"><div class="option-main">含AI生成内容</div></div><div class="mark-tag-option"><div class="option-main">内容为虚构剧情，仅供娱乐</div></div><div class="mark-tag-option"><div class="option-main">个人观点，仅供参考</div></div><div class="mark-tag-option"><div class="option-main">内容包含营销广告</div></div><div class="mark-tag-option"><div class="option-main">内容为自行拍摄</div><div class="option-sub">添加拍摄时间和地点</div></div><div class="mark-tag-option"><div class="option-main">内容为转载</div><div class="option-sub">添加转载来源(选填)</div></div></div></div></div></div>
<div class="weui-desktop-radio-group"><label class="weui-desktop-form__check-label"><input type="radio" class="weui-desktop-form__radio" value="0" /> <i class="weui-desktop-icon-radio"></i> <span class="weui-desktop-form__check-content">不定时</span></label><label class="weui-desktop-form__check-label"><input type="radio" class="weui-desktop-form__radio" value="1" /> <i class="weui-desktop-icon-radio"></i> <span class="weui-desktop-form__check-content">定时</span></label></div>
<button type="button" class="weui-desktop-btn weui-desktop-btn_primary weui-desktop-btn_disabled">发表</button></template></wujie-app>
